version: '3.8'

services:
  nexus-platform:
    build: .
    container_name: nexus-dating-container
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "53:53/udp"
      - "3000:3000"
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - DOMAIN_NAME=hook.nexus.com
