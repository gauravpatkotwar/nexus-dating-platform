services:
  # NestJS Backend API Service
  - type: web
    name: nexus-backend-api
    env: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-postgres-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  # Free PostgreSQL Database
  - name: nexus-postgres-db
    databaseName: nexus_db
    user: nexus_user
    plan: free
